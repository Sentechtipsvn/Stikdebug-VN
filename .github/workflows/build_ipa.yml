name: Build StikDebug VN IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build VN IPA
    runs-on: xcode-27
    steps:
      - name: Fetch source
        uses: actions/checkout@v6

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Verify route and location logic
        run: |
          swiftc -swift-version 5 StikDebug/Features/Location/RouteCore.swift \
            StikDebug/Features/Location/LocationLinkParser.swift \
            Validation/main.swift -o /tmp/stikdebug-vn-validation
          /tmp/stikdebug-vn-validation

      - name: Compile unsigned device app
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme StikDebug \
            -configuration Debug \
            -archivePath build/StikDebug-VN.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Package VN IPA
        id: package
        run: |
          mkdir -p Payload
          cp -R build/StikDebug-VN.xcarchive/Products/Applications/StikDebug.app Payload/
          file_name="StikDebug-VN-3.2.1-${GITHUB_SHA::7}.ipa"
          zip -qr "$file_name" Payload
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: Upload VN IPA
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file_name }}
          archive: false
          retention-days: 30

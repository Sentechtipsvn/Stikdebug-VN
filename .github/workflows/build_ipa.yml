name: Build StikDebug VN IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and Build VN 3.2.9
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Fetch source
        uses: actions/checkout@v6

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Verify route, duration, receiver and draft logic
        run: |
          set -o pipefail
          mkdir -p build
          swiftc -swift-version 5 StikDebug/Features/Location/RouteCore.swift \
            StikDebug/Features/Location/MotorcycleRouting.swift \
            StikDebug/Features/Location/LocationLinkParser.swift \
            StikDebug/Features/Location/LocationWorkflowCore.swift \
            StikDebug/Services/SigningExpirySchedule.swift \
            Validation/main.swift -o /tmp/stikdebug-vn-validation
          /tmp/stikdebug-vn-validation | tee build/core-validation.txt
          python3 Validation/verify_bridge.py | tee build/bridge-validation.txt

      - name: Exercise production playback controller and session
        run: |
          set -o pipefail
          swiftc -swift-version 5 \
            StikDebug/Features/Location/RouteCore.swift \
            StikDebug/Features/Location/LocationLinkParser.swift \
            StikDebug/Features/Location/LocationWorkflowCore.swift \
            StikDebug/Features/Location/RoutePlaybackController.swift \
            StikDebug/Features/Location/LocationWorkspaceStore.swift \
            StikDebug/Services/LocationSimulationSession.swift \
            Validation/Controller/Stubs.swift Validation/Controller/ControllerMain.swift \
            -o /tmp/stikdebug-vn-controller-validation
          /tmp/stikdebug-vn-controller-validation | tee build/controller-validation.txt

      - name: Compile unsigned device app
        run: |
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme StikDebug \
            -configuration Debug \
            -archivePath build/StikDebug-VN.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Verify identity and package update
        id: package
        run: |
          python3 Validation/verify_package.py --app-only
          mkdir -p Payload
          cp -R build/StikDebug-VN.xcarchive/Products/Applications/StikDebug.app Payload/
          file_name="StikDebug-VN-3.2.9-${GITHUB_SHA::7}.ipa"
          zip -qr "$file_name" Payload
          shasum -a 256 "$file_name" | tee build/SHA256SUMS.txt
          cat build/core-validation.txt build/controller-validation.txt build/bridge-validation.txt > build/Verification-3.2.9.txt
          cat build/SHA256SUMS.txt >> build/Verification-3.2.9.txt
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: Upload VN IPA
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file_name }}
          archive: false
          retention-days: 30

      - name: Upload verification results
        uses: actions/upload-artifact@v7
        with:
          path: build/Verification-3.2.9.txt
          archive: false
          retention-days: 30

      - name: Sign with Apple Shortcuts
        id: sign
        continue-on-error: true
        timeout-minutes: 2
        run: |
          shortcuts sign --mode anyone --input Shortcuts/StikDebug-VN.unsigned.shortcut --output build/new-signature.shortcut
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("Shortcuts/StikDebug-VN.unsigned.shortcut").read_bytes()
          signed = Path("build/new-signature.shortcut").read_bytes()
          assert signed.startswith(b"AEA1") and len(signed) > 1000
          metadata = {
              "format": "AEA1",
              "signing_mode": "anyone",
              "input_sha256": hashlib.sha256(source).hexdigest(),
              "signed_sha256": hashlib.sha256(signed).hexdigest(),
              "size": len(signed),
              "provider": "Apple shortcuts sign",
          }
          Path("Shortcuts/StikDebug-VN.shortcut").write_bytes(signed)
          Path("Shortcuts/signing.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          python3 Validation/verify_package.py --shortcut-only

      - name: Upload signed Shortcuts bridge
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: build/StikDebug-VN-Gui-Vi-Tri-3.2.9.shortcut
          archive: false
          retention-days: 30

      - name: Upload unsigned shortcut source
        if: steps.sign.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          path: Shortcuts/StikDebug-VN.unsigned.shortcut
          archive: false
          retention-days: 30
